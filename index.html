<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="tournee-offline" content="1">
<meta name="theme-color" content="#13203C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tournée">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Tournée des calendriers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one 600px app column. Navy band header with a reflective stripe (veste de feu),
   the next door shown as enamel street plates, money laid out like a deposit slip, tab bar at the bottom. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#121A2C; --muted:#586174; --line:#D7DCE5;
  --navy:#13203C; --on-navy:#F1F4F9; --navy-muted:#A9B4CB;
  --red:#BF2519; --red-press:#9C1D13; --on-red:#FFFFFF;
  --plate:#1C3C8E; --plate-rim:#FFFFFF; --on-plate:#FFFFFF;
  --band:#D8EE36; --band-2:#C6CCD7;
  --ok:#17773F; --on-ok:#FFFFFF; --ok-bg:#E1F2E7; --warn:#A35B00; --warn-bg:#FBEED6; --no:#5C6373; --no-bg:#EAEDF2; --skip:#8A92A2;
  --focus:#2A62D8;
  --map-bg:#F4F6F9; --map-road:#D3D9E2; --map-ctx:#E3E7ED; --map-cur:#F2C3BD; --map-done:#AEB6C3;
  --map-bldg:#E9E7E3; --map-bldg-l:#DCD9D3; --map-q:#1C3C8E;
  --map-todo:#1446C8; --map-num:#14327F; --map-halo:#FFFFFF; --g-road:#D71E14; --g-ctx:rgba(80,80,80,.6); --g-path:#008C3C; --g-q:#C80078; --g-bg:#F7F6F6;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C111E; --surface:#151C2C; --surface-2:#1B2335; --ink:#E6E9F0; --muted:#9AA3B7; --line:#283247;
    --navy:#09101F; --on-navy:#E6E9F0; --navy-muted:#8794AE;
    --red:#E2473B; --red-press:#C8382D; --on-red:#FFFFFF;
    --plate:#2A50B0; --plate-rim:#DCE3F2; --on-plate:#FFFFFF;
    --band:#C5DB2C; --band-2:#5F687B;
    --ok:#46BF7C; --on-ok:#06130B; --ok-bg:#132C1E; --warn:#E8A23C; --warn-bg:#33250E; --no:#A3AAB9; --no-bg:#222A3A; --skip:#7B8394;
    --focus:#7FA5FF; --map-bg:#101724; --map-road:#2B3549; --map-ctx:#1B2333; --map-cur:#5E2B2A; --map-done:#4A5468; --map-bldg:#161D2A; --map-bldg-l:#252E40; --map-q:#9DB8FF; --map-todo:#5B8CFF; --map-num:#BFD0FF; --map-halo:#111317; --g-road:#FF4A3D; --g-ctx:rgba(200,200,200,.45); --g-path:#3DDC84; --g-q:#FF5CC8; --g-bg:#191A1B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C111E; --surface:#151C2C; --surface-2:#1B2335; --ink:#E6E9F0; --muted:#9AA3B7; --line:#283247;
  --navy:#09101F; --on-navy:#E6E9F0; --navy-muted:#8794AE;
  --red:#E2473B; --red-press:#C8382D; --on-red:#FFFFFF;
  --plate:#2A50B0; --plate-rim:#DCE3F2; --on-plate:#FFFFFF;
  --band:#C5DB2C; --band-2:#5F687B;
  --ok:#46BF7C; --on-ok:#06130B; --ok-bg:#132C1E; --warn:#E8A23C; --warn-bg:#33250E; --no:#A3AAB9; --no-bg:#222A3A; --skip:#7B8394;
  --focus:#7FA5FF; --map-bg:#101724; --map-road:#2B3549; --map-ctx:#1B2333; --map-cur:#5E2B2A; --map-done:#4A5468; --map-bldg:#161D2A; --map-bldg-l:#252E40; --map-q:#9DB8FF; --map-todo:#5B8CFF; --map-num:#BFD0FF; --map-halo:#111317; --g-road:#FF4A3D; --g-ctx:rgba(200,200,200,.45); --g-path:#3DDC84; --g-q:#FF5CC8; --g-bg:#191A1B; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--navy)}
body.noscroll{overflow:hidden}
.gut{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.col{max-width:600px;margin-inline:auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase}

/* Header */
.top{background:var(--navy);color:var(--on-navy)}
.top::after{content:"";display:block;height:9px;background:linear-gradient(var(--band) 0 3px,var(--band-2) 3px 6px,var(--band) 6px 9px)}
.top-in{padding-block:14px 12px;display:grid;gap:10px}
.top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top .eyebrow{color:var(--navy-muted)}
.top h1{font-size:26px;line-height:1.05}
.ttl{min-width:0}
.sync{font-size:12.5px;color:var(--navy-muted);display:flex;align-items:center;gap:6px;text-align:right;max-width:46%;padding-top:2px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.sync.s-ok{color:#7FD3A2}.sync.s-saving{color:var(--navy-muted)}.sync.s-offline{color:#F2B65A}.sync.s-demo{color:var(--band)}
.prog{display:grid;gap:6px}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;background:var(--band);border-radius:4px;transition:width .3s}
.prog-txt{font-size:14px;color:var(--navy-muted)}
.prog-txt b{color:var(--on-navy);font-weight:600}

main{padding-block:16px 8px}
.stack{display:grid;gap:16px}

/* Generic controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn:active{transform:translateY(1px)}
.btn-red{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn-red:active{background:var(--red-press)}
.btn-wide{width:100%}
.btn-quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn.armed,.link.armed{background:var(--red);border-color:var(--red);color:var(--on-red)}
.link{background:none;border:0;padding:8px 4px;color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;display:inline-flex;align-items:center;gap:6px;min-height:40px;border-radius:6px}
a.link{color:var(--ink)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1 1 0;min-width:0;min-height:42px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--muted);padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(10,20,40,.12),0 0 0 1px var(--line)}
.cnt{font-variant-numeric:tabular-nums;font-size:13px;background:var(--no-bg);color:var(--muted);border-radius:20px;padding:1px 8px}
.seg button[aria-pressed="true"] .cnt{background:var(--ink);color:var(--surface)}
.field{display:grid;gap:6px}
.field label,.lbl{font-size:13.5px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:16px}
textarea.inp{min-height:90px;resize:vertical}
.hint{font-size:13.5px;color:var(--muted);margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 > *{min-width:0}

/* Demo banner */
.demo{border:1.5px dashed var(--warn);background:var(--warn-bg);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.demo p{margin:0;font-size:14.5px}
.demo b{color:var(--warn)}

/* Next door card */
.next{background:var(--surface);border-radius:16px;border:1px solid var(--line);box-shadow:0 10px 24px -14px rgba(10,20,45,.35);padding:16px;display:grid;gap:12px}
.next-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.next-top .eyebrow{color:var(--red)}
.next-meta{font-size:13.5px;color:var(--muted)}
.plates{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.plate{background:var(--plate);color:var(--on-plate);border-radius:9px;padding:4px;display:flex;min-width:0;max-width:100%}
.plate>span{display:flex;align-items:center;border:2px solid var(--plate-rim);border-radius:6px;padding:4px 12px;font-family:var(--f-display);font-weight:700;min-width:0;overflow-wrap:anywhere}
.plate.n>span{font-size:46px;line-height:1;font-variant-numeric:tabular-nums;justify-content:center;min-width:64px}
.plate.s{flex:1 1 180px}
.plate.s>span{font-size:22px;line-height:1.1;width:100%}
.next-sub{margin:0;color:var(--muted);font-size:15px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:12.5px;font-weight:700;border-radius:20px;padding:2px 9px;background:var(--no-bg);color:var(--no)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.note-line,.prev{margin:0;font-size:14.5px;display:flex;gap:8px;align-items:flex-start;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.prev{color:var(--muted)}
.btn-pris{min-height:60px;border-radius:12px;border:0;background:var(--ok);color:var(--on-ok);font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-pris svg.i{width:26px;height:26px;stroke-width:2.6}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.q{min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:14.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 4px;line-height:1.15;text-align:center}
.q-refus{color:var(--no)}.q-absent{color:var(--warn)}.q-skip{color:var(--muted)}
.next-foot{display:flex;flex-wrap:wrap;gap:0 10px;align-items:center;border-top:1px solid var(--line);padding-top:6px}
.then{margin:0;font-size:13.5px;color:var(--muted)}
.then b{color:var(--ink);font-weight:600}
.done{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px;display:grid;gap:10px}
.done h2{font-size:24px}
.done p{margin:0;color:var(--muted)}

/* Filters */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;border-radius:20px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}

/* Streets list */
.streets{display:grid;gap:10px}
.street{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.s-head{width:100%;border:0;background:none;display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:12px;text-align:left}
.s-idx{font-family:var(--f-display);font-weight:700;font-size:15px;width:28px;height:28px;border-radius:7px;background:var(--plate);color:var(--on-plate);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.s-name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.s-stat{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.s-head svg.i{transition:transform .2s;color:var(--muted)}
.s-head[aria-expanded="true"] svg.i{transform:rotate(90deg)}
.s-bar{height:3px;background:var(--line)}
.s-bar i{display:block;height:100%;background:var(--ok)}
.s-sub{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center;padding:6px 12px 2px;font-size:13.5px;color:var(--muted)}
.s-sub .link{font-size:13.5px;min-height:36px}
.rows{list-style:none;margin:0;padding:4px 6px 8px}
.r{width:100%;display:grid;grid-template-columns:5.2em 3.6em 1fr 10px;align-items:center;gap:8px;border:0;background:none;padding:10px 8px;border-radius:8px;text-align:left;min-height:46px}
.r + .r{border-top:1px solid var(--line)}
.rows li + li .r{border-top:1px solid var(--line)}
.r-num{font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.r-side{font-size:12.5px;color:var(--muted)}
.r-what{font-size:14px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.r-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.r.st-pris .r-what{color:var(--ok);font-weight:600}.r.st-pris .r-dot{background:var(--ok);border-color:var(--ok)}
.r.st-refus .r-what{color:var(--no)}.r.st-refus .r-dot{background:var(--no);border-color:var(--no)}
.r.st-absent .r-what{color:var(--warn);font-weight:600}.r.st-absent .r-dot{background:var(--warn-bg);border-color:var(--warn)}
.r.st-skip .r-num{color:var(--skip);text-decoration:line-through}.r.st-skip .r-dot{border-style:dashed;border-color:var(--skip)}
.r.is-next{background:var(--warn-bg);box-shadow:inset 3px 0 0 var(--red)}
.r.is-next .r-what{color:var(--red);font-weight:700}

/* Panels (caisse, secteur) */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.panel h2{font-size:21px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.due{background:var(--navy);color:var(--on-navy);border:1px solid var(--line);border-radius:16px;padding:18px 16px;display:grid;gap:4px}
.due .eyebrow{color:var(--navy-muted)}
.due-amt{font-family:var(--f-display);font-weight:700;font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.due p{margin:4px 0 0;color:var(--navy-muted);font-size:14.5px}
.slip{border-top:2px solid var(--ink);margin:0;padding:0}
.slip > div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.slip dt{color:var(--muted)}
.slip dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.slip .tot dt,.slip .tot dd{color:var(--ink);font-weight:700;font-size:17px}
.slip .sub dt{padding-left:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions .btn{flex:1 1 150px}
.actions.col{flex-direction:column;flex-wrap:nowrap;align-items:stretch;width:100%;align-self:stretch}.actions.col .btn{flex:none;width:100%}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.tile b{font-family:var(--f-display);font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td.r-al,th.r-al{text-align:right}
.dep{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.sou{border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;margin-top:12px;background:var(--surface)}
.sou.cur{border:2px solid var(--plate);padding:11px 13px 13px}
.sou-head{display:flex;align-items:center;gap:8px}
.sou-head h3{margin:0;font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.01em}
.sou-tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:99px;background:var(--no-bg);color:var(--no)}
.sou-tag.now{background:var(--plate);color:var(--on-plate)}
.sou-tag.done{background:var(--ok-bg);color:var(--ok)}
.sou-cal{margin-left:auto;color:var(--muted);font-size:15px}
.sou-cal b{color:var(--ink);font-size:20px}
.sou-bar{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin:10px 0 6px}
.sou-bar i{display:block;height:100%;background:var(--plate)}
.sou-st{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--muted)}
.sou-st.ok{color:var(--ok)}
.sou-st.warn{color:var(--warn)}
.sou .slip dt small{font-weight:400}
.sou-chq{margin-top:8px}
.sou .actions{margin-top:12px}
.sou > .link{margin-top:8px}
.sou-seg button{flex-direction:column;line-height:1.05}
.sou-seg button small{display:block;font-size:11px;font-weight:600;opacity:.85}
.sou-seg button:disabled{opacity:.45;cursor:not-allowed}
.slip > div.tap{position:relative}
.slip .tap dt button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.slip .tap dt button::after{content:"";position:absolute;inset:0}
.slip .tap dt button:focus-visible{outline:none}
.slip > div.tap:has(button:focus-visible){outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.slip .tap dt button .i{width:16px;height:16px;color:var(--muted)}
.sl-chips{margin:4px 0 10px}
.chip small{font-weight:500;opacity:.75}
.soul{list-style:none;margin:0;padding:0}
.soul li{padding:11px 0;border-bottom:1px dashed var(--line)}
.sl-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sl-when{font-weight:700}
.sl-top b{font-size:17px}
.sl-what{color:var(--muted);margin-top:2px}
.sl-what small{display:block;font-size:13px}
.sl-act{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.sl-act span{font-size:13px;color:var(--muted)}
.btn.btn-sm{min-height:36px;padding:0 14px;font-size:14px;flex:none}
.dep div{min-width:0}
.dep small{display:block;color:var(--muted)}
.empty .steps{text-align:left;margin:4px auto 16px;max-width:30em;padding-left:1.3em;line-height:1.45}
.empty .steps li{margin:6px 0}
button.dep.ex{width:100%;background:none;border:0;border-bottom:1px dashed var(--line);font:inherit;color:var(--ink);text-align:left;cursor:pointer;padding:10px 0}
.ex-tot{margin-top:10px}
.cash{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.cash label{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:10px;padding:6px 8px;font-weight:600;font-variant-numeric:tabular-nums}
.cash label span{width:3.6em;text-align:right;flex:none}
.cash input{width:100%;min-width:0;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 8px;font-size:16px;text-align:center}
.diff{font-weight:700}
.diff.ok{color:var(--ok)}.diff.bad{color:var(--warn)}

/* ---------- persistence ---------- */
const P = {mode: 'boot', db: null, prefix: null, dirty: new Set(), gen: {}, flushing: false, remoteKeys: new Set(), sync: 'local', dl: null, ft: 0, rt: 0, undo: null};
const docBody = key => { if (key === 'meta') return {...S.meta, kind: 'meta'}; const s = S.streets[key.slice(2)]; return s ? {...s, kind: 'street'} : null; };
function writeLocal() {
  if (demo) return;
  try { localStorage.setItem(LS_KEY, JSON.stringify({meta: S.meta, streets: S.streets, dirty: [...P.dirty]})); } catch (e) {}
}
function touch(key) {
  if (demo) return;
  const t = now();
  if (key === 'meta') S.meta.u = t; else { const s = S.streets[key.slice(2)]; if (s) s.u = t; }
  P.dirty.add(key); P.gen[key] = (P.gen[key] || 0) + 1;
  writeLocal();
  if (P.mode === 'db') { clearTimeout(P.ft); P.ft = setTimeout(flush, 350); setSync('saving'); }
  else setSync();
}
async function flush() {
  if (P.mode !== 'db' || P.flushing) return;
  P.flushing = true;
  try {
    while (P.dirty.size) {
      const key = P.dirty.values().next().value;
      const g = P.gen[key] || 0;
      const body = docBody(key);
      try {
        const ref = P.db.doc(P.prefix + '/' + key);
        if (body) await ref.set(JSON.parse(JSON.stringify(body))); else await ref.delete();
        if ((P.gen[key] || 0) === g) P.dirty.delete(key);
        if (body) P.remoteKeys.add(key); else P.remoteKeys.delete(key);
      } catch (e) {
        const code = e && e.code;
        if (code === 'quota_exceeded') { P.dirty.delete(key); toast('Stockage en ligne plein : supprime d’anciennes rues pour continuer.'); continue; }
        if (code === 'invalid_argument' || code === 'transform_error') {
          P.mode = 'local'; writeLocal(); setSync();
          toast('Enregistrement en ligne refusé pour ce compte : tout reste enregistré sur ce téléphone.');
          return;
        }
        if (['revoked', 'not_granted', 'capability_disabled', 'capability_removed'].includes(code)) { P.mode = 'local'; writeLocal(); setSync(); return; }
        writeLocal(); setSync('offline');
        clearTimeout(P.rt); P.rt = setTimeout(flush, 20000);
        return;
      }
    }
    writeLocal(); setSync('ok');
  } finally {
    P.flushing = false;
    if (P.dirty.size && P.sync !== 'offline') { clearTimeout(P.ft); P.ft = setTimeout(flush, 350); }
  }
}
window.addEventListener('online', () => { if (P.mode === 'db' && P.dirty.size) flush(); });

function setSync(s) {
  if (s) P.sync = s;
  else P.sync = demo ? 'demo' : (P.mode === 'db' ? (P.dirty.size ? 'saving' : 'ok') : 'local');
  if (demo) P.sync = 'demo';
  const el = $('#syncLbl'); if (!el) return;
  const L = {demo: 'Exemple · rien n’est enregistré', local: 'Enregistré sur ce téléphone', ok: 'Enregistré', saving: 'Enregistrement…', loading: 'Chargement…', offline: 'Hors ligne · gardé sur le téléphone'};
  el.className = 'sync s-' + P.sync; el.textContent = L[P.sync] || '';
}

function applyRemote(snap) {
  let changed = false;
  const docs = snap.docs.filter(d => d.exists);
  if (demo && docs.length) { S = {meta: defaultMeta(), streets: {}}; demo = false; changed = true; }
  for (const d of docs) {
    const data = d.data(); if (!data) continue;
    const key = d.id; P.remoteKeys.add(key);
    if (key === 'meta') {
      if ((data.u || 0) > (S.meta.u || 0)) { const m = JSON.parse(JSON.stringify(data)); delete m.kind; S.meta = normMeta(m); P.dirty.delete('meta'); changed = true; }
    } else if (key.startsWith('s_')) {
      const id = key.slice(2), loc = S.streets[id];
      if (!loc || (data.u || 0) > (loc.u || 0)) { const s = JSON.parse(JSON.stringify(data)); delete s.kind; S.streets[id] = normStreet(s); P.dirty.delete(key); changed = true; }
    }
  }
  for (const ch of snap.docChanges()) {
    if (ch.type !== 'removed') continue;
    const key = ch.doc.id; P.remoteKeys.delete(key);
    if (key.startsWith('s_') && S.streets[key.slice(2)] && !P.dirty.has(key)) { delete S.streets[key.slice(2)]; changed = true; }
  }
  if (changed) { writeLocal(); render(true); }
}
async function boot() {
  let local = null;
  try { local = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) {}
  if (local && local.meta) {
    S = {meta: normMeta(local.meta), streets: {}};
    for (const id in (local.streets || {})) S.streets[id] = normStreet(local.streets[id]);
    (local.dirty || []).forEach(k => P.dirty.add(k));
    P.mode = 'local';
  } else if (OFFLINE) { S = {meta: defaultMeta(), streets: {}}; demo = false; P.mode = 'local'; }
  else { S = makeDemo(); demo = true; P.mode = 'local'; }
  const adv0 = demo ? null : souAdvance();
  render();
  if (adv0) toast(adv0.txt);
  if (!window.claude || typeof window.claude.use !== 'function') { setSync(); return; }
  window.claude.use('downloads').then(d => { P.dl = d; }).catch(() => {});
  let user = null, db = null;
  try { [user, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]); } catch (e) {}
  if (!db || !user) { setSync(); return; }
  let prefix = null;
  try {
    if (await user.isOwner()) prefix = 'tournee';
    else { const id = await user.id(); const cw = await user.can('data.write'); if (id && cw !== false) prefix = 'data/users/' + id; }
  } catch (e) {}
  if (!prefix) { setSync(); return; }
  P.db = db; P.prefix = prefix; P.mode = 'db'; setSync('loading');
  let definitive = false;
  const timer = setTimeout(() => { if (!definitive) setSync('offline'); }, 10000);
  try {
    db.collection(prefix).onSnapshot(snap => {
      applyRemote(snap);
      if (!snap.metadata.fromCache && !definitive) {
        definitive = true; clearTimeout(timer);
        if (!demo) {
          if (!P.remoteKeys.has('meta')) P.dirty.add('meta');
          for (const id in S.streets) if (!P.remoteKeys.has('s_' + id)) P.dirty.add('s_' + id);
        }
        if (P.dirty.size) setTimeout(flush, 50); else setSync();
      }
    }, () => { clearTimeout(timer); P.mode = 'local'; setSync(); });
  } catch (e) { clearTimeout(timer); P.mode = 'local'; setSync(); }
}

/* ---------- demo ---------- */
function makeDemo() {
  const st = {meta: defaultMeta(), streets: {}};
  st.meta.settings.stock = 150; st.meta.settings.float = 30;
  const defs = [['Rue des Lilas', '1-23, 2-26'], ['Impasse des Tilleuls', '1-9, 2-10'], ['Rue Victor Hugo', '1-37, 2-34, 15bis'], ['Avenue du Général de Gaulle', '1-29, 2-30']];
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const day = 864e5, t0 = now() - day;
  let doneCount = 0;
  defs.forEach(([name, nums], i) => {
    const id = 'demo' + i;
    st.streets[id] = normStreet({id, name, addrs: parseNums(nums).map(n => newAddr(n)), u: 1});
    st.meta.order.push(id);

    doneCount++;

  S = prevS;
  st.streets.demo2.addrs[3].note = 'Repasser après 18 h';
  st.meta.deposits = [{id: 'd1', a: 150, type: 'esp', note: 'Remise intermédiaire', t: t0 + 3 * 36e5}];
  return st;
}

    <div class="actions"><button class="btn" data-act="copyRecap">${icon('copy')} Copier le récap</button><button class="btn" data-act="exportCsv">${icon('dl')} Exporter en CSV</button></div>
    <p class="hint">Règle de reversement et stock : onglet Secteur, rubrique Réglages.</p>
  </section>`;
  const ex = S.meta.extra.slice().sort((a, b) => b.t - a.t);
  h += `<section class="panel"><div class="panel-head"><h2>Ventes hors tournée</h2><button class="btn" data-act="addExtra">${icon('plus')} Ajouter</button></div>
    ${ex.length ? ex.map(e => `<button class="dep ex" data-act="editExtra" data-id="${e.id}"><div><b>${esc(e.who || 'Hors tournée')}</b> · ${+e.k || 1} calendrier${(+e.k || 1) > 1 ? 's' : ''}<small>${new Date(e.t).toLocaleDateString('fr-FR', {weekday: 'short', day: 'numeric', month: 'short'})} · ${PAY[e.pay] || PAY.esp}${e.note ? ' · ' + esc(e.note) : ''}</small></div><b class="num">${eur(+e.a || 0, true)}</b></button>`).join('') +

  </section>`;
  h += `<details class="panel" id="cashBox" data-keep="cash" ${UI.det.cash ? 'open' : ''}><summary><h2>Compter ma caisse</h2>${icon('chev')}</summary>

    <div class="cash">${DENOMS.map(d => `<label><span>${d >= 1 ? d + ' €' : Math.round(d * 100) + ' c'}</span><input inputmode="numeric" pattern="[0-9]*" id="cash-${String(d).replace('.', '_')}" data-cash="${d}" value="${S.meta.cash[d] || ''}" placeholder="0" aria-label="Nombre de ${d >= 1 ? d + ' euros' : Math.round(d * 100) + ' centimes'}"></label>`).join('')}</div>
    <dl class="slip"><div><dt>Compté</dt><dd id="cashCounted">—</dd></div><div class="tot"><dt>Écart</dt><dd id="cashDiff">—</dd></div></dl>
    <button class="link" data-act="clearCash">Remettre le comptage à zéro</button>
  </details>`;
  h += statsPanel(T);
  return h;
}
function updateCash() {
  const T = totals();
  let c = 0; for (const d of DENOMS) c += d * (+S.meta.cash[d] || 0);
  c = round2(c);
  const any = DENOMS.some(d => +S.meta.cash[d]);
  const el = $('#cashCounted'), dd = $('#cashDiff'); if (!el) return;
  el.textContent = any ? eur(c, true) : '—';
  if (!any) { dd.textContent = '—'; dd.className = ''; return; }
  const diff = round2(c - T.cashExpected);
  dd.className = 'diff ' + (diff === 0 ? 'ok' : 'bad');
  dd.textContent = diff === 0 ? 'Le compte est bon' : (diff > 0 ? '+ ' : '− ') + eur(Math.abs(diff), true);
}
function statsPanel(T) {
  const rang = T.pris + T.refus + T.absent;
  const days = {};
  for (const s of Object.values(S.streets)) for (const a of s.addrs) {
    if (a.st === 'todo' || !a.t) continue;
    const d = new Date(a.t), key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const o = days[key] || (days[key] = {t: a.t, doors: 0, pris: 0, sum: 0, min: a.t, max: a.t});
    o.doors++; o.min = Math.min(o.min, a.t); o.max = Math.max(o.max, a.t);
    if (a.st === 'pris') { o.pris++; o.sum += +a.a || 0; }
  }
  const dk = Object.keys(days).sort().reverse();
  const dur = ms => { const m = Math.round(ms / 60000); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0'); };
  const per = orderedStreets().map(s => {
    const o = {name: s.name, n: s.addrs.length, done: 0, rang: 0, sum: 0};
    for (const a of s.addrs) { if (a.st !== 'todo') o.done++; if (['pris', 'refus', 'absent'].includes(a.st)) o.rang++; if (a.st === 'pris') o.sum += +a.a || 0; }
    return o;
  });
  return `<section class="panel"><h2>Bilan</h2>
    <div class="tiles">
      <div class="tile"><b>${pct(T.pris + T.refus, rang)}</b><span>des portes s’ouvrent</span></div>
      <div class="tile"><b>${pct(T.pris, T.pris + T.refus)}</b><span>prennent quand on leur ouvre</span></div>
      <div class="tile"><b>${T.pris ? eur(T.addrTotal / T.pris) : '—'}</b><span>don moyen par foyer</span></div>
      <div class="tile"><b>${rang ? eur(T.addrTotal / rang) : '—'}</b><span>rapporté par porte sonnée</span></div>
    </div>
    ${dk.length ? `<h3 class="lbl">Sorties</h3><div class="tbl-wrap"><table><thead><tr><th>Jour</th><th class="r-al">Portes</th><th class="r-al">Pris</th><th class="r-al">Montant</th><th class="r-al">Durée</th></tr></thead><tbody>
      ${dk.map(k => { const o = days[k]; return `<tr><td>${new Date(o.t).toLocaleDateString('fr-FR', {weekday: 'short', day: 'numeric', month: 'short'})}</td><td class="r-al">${o.doors}</td><td class="r-al">${o.pris}</td><td class="r-al">${eur(o.sum)}</td><td class="r-al">${o.max > o.min ? dur(o.max - o.min) : '—'}</td></tr>`; }).join('')}
    </tbody></table></div>` : ''}
    ${per.length ? `<h3 class="lbl">Par rue</h3><div class="tbl-wrap"><table><thead><tr><th>Rue</th><th class="r-al">Faites</th><th class="r-al">Montant</th><th class="r-al">€ / porte</th></tr></thead><tbody>
      ${per.map(o => `<tr><td>${esc(o.name)}</td><td class="r-al">${o.done}/${o.n}</td><td class="r-al">${eur(o.sum)}</td><td class="r-al">${o.rang ? eur(o.sum / o.rang) : '—'}</td></tr>`).join('')}
    </tbody></table></div>` : ''}
  </section>`;
}

    <p class="preview" id="bulkPrev">Rien à importer</p>

      ${st.rule === 'pct' ? `<div class="field"><label for="setPct">Pourcentage reversé (%)</label><input class="inp" id="setPct" data-set="pct" data-num="1" inputmode="decimal" value="${st.pct}" placeholder="100"></div>` : ''}

/* ---------- sheet ---------- */
let SH = null;
function openSheet(ctx) {
  SH = ctx; renderSheet();
  $('#sheetWrap').hidden = false; document.body.classList.add('noscroll');
}
function closeSheet() {
  const wasAdd = SH && SH.kind === 'addHouse';
  if (SH && SH.kind === 'mapHouse') Q.num = '';
  SH = null; $('#sheetWrap').hidden = true; document.body.classList.remove('noscroll');
  if (wasAdd && (mapMode || mapPend)) { mapMode = null; mapPend = null; if (UI.tab === 'plan') renderView(); }
}
function sheetTitle(t, sub) { return `<div class="sh-title"><div><h3>${t}</h3>${sub ? `<p>${sub}</p>` : ''}</div><button class="x" data-act="closeSheet" aria-label="Fermer">${icon('close')}</button></div>`; }
function payseg(act, cur) { return `<div class="seg" role="group" aria-label="Paiement">${Object.keys(PAY).map(k => `<button data-act="${act}" data-v="${k}" aria-pressed="${cur === k}">${PAY[k]}</button>`).join('')}</div>`; }
function stepper(act, label, val) { return `<div class="stepper"><span class="lbl">${label}</span><div><button data-act="${act}" data-d="-1" aria-label="Moins">−</button><output id="${act}Out">${val}</output><button data-act="${act}" data-d="1" aria-label="Plus">+</button></div></div>`; }

    if (d.st === 'pris') h += `<div class="field"><label for="dAmt">Montant (€)</label><input class="inp" id="dAmt" inputmode="decimal" value="${d.a === '' ? '' : String(d.a).replace('.', ',')}"></div>` + payseg('dPay', d.pay) + stepper('dK', 'Calendriers', d.k) + souSeg('dSc', d.sc, d.k, a, a.st === 'pris' ? souOf(a) : 0, a.st === 'pris' ? +a.k || 1 : 0);

    if (a.t && a.st !== 'todo') h += `<p class="hint">Dernière mise à jour : ${new Date(a.t).toLocaleString('fr-FR', {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'})}</p>`;

let toastT = 0;

  el.hidden = false; P.undo = undo || null;

const armed = new Map();
function confirmTap(btn, fn) {
  const k = btn.dataset.act + (btn.dataset.id || btn.dataset.sid || '');
  if (armed.get(k)) { armed.delete(k); fn(); return; }
  armed.set(k, 1);
  const old = btn.innerHTML;
  btn.textContent = btn.dataset.confirm || 'Confirmer ?'; btn.classList.add('armed');
  setTimeout(() => { if (armed.get(k)) { armed.delete(k); if (btn.isConnected) { btn.innerHTML = old; btn.classList.remove('armed'); } } }, 4000);
}
function copyText(text, okMsg) {

    navigator.clipboard.writeText(text).then(() => toast(okMsg || 'Copié'), () => openSheet({kind: 'copy', text}));
  } catch (e) { openSheet({kind: 'copy', text}); }
}
function saveFile(filename, data, okMsg) {
  if (!P.dl && OFFLINE) {
    const blob = new Blob([data], {type: filename.endsWith('.csv') ? 'text/csv' : 'application/json'});
    const dl = () => { const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); toast(okMsg || 'Fichier enregistré'); };
    try {
      const f = new File([blob], filename, {type: blob.type});
      if (navigator.canShare && navigator.canShare({files: [f]})) { navigator.share({files: [f]}).then(() => toast(okMsg || 'Fichier enregistré'), e => { if (!e || e.name !== 'AbortError') dl(); }); return; }
    } catch (e) {}
    dl(); return;
  }
  if (!P.dl) { copyText(data, 'Contenu copié (export de fichier indisponible ici)'); return; }
  P.dl.save({filename, data}).then(() => toast(okMsg || 'Fichier enregistré'), e => {
    const c = e && e.code;
    if (c === 'declined') return;
    if (c === 'rate_limited') { toast('Une demande est déjà ouverte, réessaie dans un instant.'); return; }
    openSheet({kind: 'copy', text: data});
  });
}

function addNumbersTo(s, nums) {

  let n = 0;
  for (const x of nums) if (!have.has(x.toLowerCase())) { s.addrs.push(newAddr(x)); have.add(x.toLowerCase()); n++; }

const cleanName = n => { n = String(n || '').replace(/\s+/g, ' ').trim(); return n ? n[0].toUpperCase() + n.slice(1) : ''; };

  S.meta.order = orderedStreets().map(x => x.id).filter(x => x !== id).concat(id);

function parseBulk(txt) {
  const res = [];
  for (const raw of String(txt || '').split(/\n+/)) {
    const line = raw.trim(); if (!line) continue;
    let name, nums;
    const m = line.match(/^(.+?)\s*[:=|]\s*(.*)$/);
    if (m) { name = m[1]; nums = m[2]; }
    else { const k = line.search(/\s\d/); if (k > 0) { name = line.slice(0, k); nums = line.slice(k); } else { name = line; nums = ''; } }
    name = cleanName(name); if (name) res.push({name, nums: parseNums(nums)});
  }
  return res;
}

// adds a file from the other version to what is here: nothing is deleted; for each door the latest note wins
function mergeData(obj) {
  if (!obj || !obj.meta || !obj.streets) { toast('Fichier non reconnu : choisis un fichier exporté depuis cette appli.'); return; }
  const inMeta = normMeta(obj.meta); let upd = 0, add = 0, newSt = 0;
  if (demo) S = {meta: defaultMeta(), streets: {}};   // the demo street list is not real data: start from nothing
  demo = false;
  for (const id in obj.streets) {
    const inc = normStreet(JSON.parse(JSON.stringify(obj.streets[id]))), loc = S.streets[id];
    if (!loc) { S.streets[id] = inc; touch('s_' + id); newSt++; add += inc.addrs.length; continue; }
    const incNewer = (inc.u || 0) > (loc.u || 0); let ch = false;
    for (const b of inc.addrs) {
      const i = loc.addrs.findIndex(a => a.id === b.id);
      if (i < 0) { loc.addrs.push(b); add++; ch = true; continue; }
      const a = loc.addrs[i], ta = a.t || 0, tb = b.t || 0;
      if ((tb > ta || (tb === ta && incNewer)) && JSON.stringify(a) !== JSON.stringify(b)) { loc.addrs[i] = b; upd++; ch = true; }
    }
    if (incNewer) for (const k of ['name', 'commune', 'mode', 'dir', 'side']) if (inc[k] !== undefined && loc[k] !== inc[k]) { loc[k] = inc[k]; ch = true; }
    if (ch) touch('s_' + id);
  }
  const m = S.meta, mNewer = (inMeta.u || 0) > (m.u || 0);
  const union = (A, B) => { const out = A.slice(); let n = 0; for (const x of B) { const i = out.findIndex(y => y.id === x.id); if (i < 0) { out.push(x); n++; } else if (mNewer) out[i] = x; } return [out, n]; };
  const [deps] = union(m.deposits, inMeta.deposits), [ex, ne] = union(m.extra, inMeta.extra);
  if (mNewer) { m.settings = inMeta.settings; m.cash = inMeta.cash; m.passStart = inMeta.passStart; if (inMeta.route) m.route = inMeta.route; }
  else if (!m.route && inMeta.route) m.route = inMeta.route;
  m.order = [...new Set((mNewer ? inMeta.order.concat(m.order) : m.order.concat(inMeta.order)))].filter(id => S.streets[id]);
  m.qx = [...new Set([...(m.qx || []), ...(inMeta.qx || [])])];
  m.deposits = deps; m.extra = ex;
  touch('meta'); render();
  if (!upd && !add && !ne) { toast('Rien de nouveau dans ce fichier : tout était déjà à jour'); return; }
  toast(`Données récupérées : ${upd} porte${upd > 1 ? 's' : ''} mise${upd > 1 ? 's' : ''} à jour, ${add} ajoutée${add > 1 ? 's' : ''}${newSt ? ' (' + newSt + ' rue' + (newSt > 1 ? 's' : '') + ')' : ''}${ne ? ', ' + ne + ' vente' + (ne > 1 ? 's' : '') + ' hors tournée' : ''}`);
}

  }
  if (t.dataset.set) {
    if (demo) { toast('C’est la tournée d’exemple : crée ta tournée pour enregistrer tes réglages.'); }
    let val = t.value;
    if (t.dataset.int) val = Math.max(0, parseInt(val, 10) || 0);
    else if (t.dataset.num) { val = parseAmt(val); if (!(val >= 0)) val = 0; }
    if (t.dataset.set === 'souche') { const n = Math.max(1, val), f = souFirstFree(1, null, n); if (f !== n) { toast(`La souche ${n} est pleine : la souche en cours est la ${f}`); t.value = f; } val = f; }
    S.meta.settings[t.dataset.set] = val; touch('meta'); renderHeader();
    if (t.dataset.set === 'soucheSize') { const adv = souAdvance(); if (adv) { toast(adv.txt); const c = $('#setSouCur'); if (c) c.value = adv.n; } }
  }
  if (t.dataset.cash) { S.meta.cash[t.dataset.cash] = Math.max(0, parseInt(t.value, 10) || 0); touch('meta'); updateCash(); }
  if (t.id === 'fileIn' && t.files && t.files[0]) {
    const r = new FileReader();
    r.onload = () => { let obj = null; try { obj = JSON.parse(r.result); } catch (err) { toast('Fichier illisible : choisis un fichier .json exporté depuis cette appli.'); } if (obj) { if (P.importMode === 'replace') importData(obj); else mergeData(obj); } P.importMode = null; t.value = ''; };
    r.readAsText(t.files[0]);
  }
});
document.addEventListener('toggle', e => {
  const d = e.target; if (d && d.dataset && d.dataset.keep) { UI.det = UI.det || {}; UI.det[d.dataset.keep] = d.open; saveUI(); }
}, true);
document.addEventListener('keydown', e => {
  const tg = e.target, typing = tg && /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName);
  if (!typing && !SH && UI.tab === 'tour' && UI.mode === 'quick' && !e.metaKey && !e.ctrlKey && !e.altKey) {
    if (/^\d$/.test(e.key)) { e.preventDefault(); qKey(e.key); return; }
    if (e.key === 'Backspace') { e.preventDefault(); qKey('del'); return; }
    if (e.key === 'b' || e.key === 'B') { qKey('bis'); return; }
  }
  if (e.key === 'Enter' && e.target.id === 'qnName') { e.preventDefault(); $('[data-act="qnSave"]').click(); }
  if (e.key === 'Enter' && e.target.id === 'ahNum') { e.preventDefault(); $('[data-act="ahSave"]').click(); }
  if (e.key === 'Enter' && e.target.id === 'fxNum') { e.preventDefault(); $('[data-act="fxSave"]').click(); }
  if (e.key === 'Escape' && SH) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'saleOther') $('[data-act="saleOther"]').click();
  if (e.key === 'Enter' && e.target.id === 'nsName') { e.preventDefault(); $('#nsNums').focus(); }
  if (e.key === 'Enter' && e.target.id === 'nsNums') { e.preventDefault(); $('[data-act="addStreet"]').click(); }
});

boot();
if (OFFLINE) {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
})();
</script>
